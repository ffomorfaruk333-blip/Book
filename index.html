
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Social Book</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f3f5f9;
  color:#222;
  padding-bottom:70px;
}

/* HEADER */
header{
  background:linear-gradient(135deg,#7b2cff,#2196f3);
  color:white;
  padding:15px;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.header{
  max-width:700px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

.search{
  width:130px;
  padding:9px 12px;
  border:0;
  outline:none;
  border-radius:20px;
  background:rgba(255,255,255,.2);
  color:white;
}

.search::placeholder{
  color:white;
}

/* MAIN */
main{
  max-width:700px;
  margin:20px auto;
  padding:0 12px;
}

/* POST BOX */
.post-box{
  background:white;
  padding:16px;
  border-radius:16px;
  margin-bottom:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

textarea{
  width:100%;
  height:90px;
  resize:none;
  border:1px solid #ddd;
  border-radius:12px;
  padding:12px;
  outline:none;
  font-size:15px;
}

.post-btn{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:0;
  border-radius:10px;
  background:linear-gradient(135deg,#7b2cff,#2196f3);
  color:white;
  font-size:16px;
  font-weight:bold;
}
